[package]
name = "pixel-art-gen"
version = "0.2.0"
edition = "2021"
description = "Desktop painter with AI-inspired preview built on Tauri"
authors = ["Pixel Art Gen Contributors"]
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.21"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = ["dialog-open"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
